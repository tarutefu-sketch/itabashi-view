<script>
'use strict';
const $=id=>document.getElementById(id), decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
$('unlock').addEventListener('submit',async event=>{
 event.preventDefault();$('error').textContent='';$('open').disabled=true;$('open').textContent='開いています…';
 try{
  if(!crypto.subtle)throw new Error('https');
  const data=JSON.parse($('payload').textContent);
  if(data.version!==1||data.iterations!==600000)throw new Error('format');
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode($('password').value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:decode(data.salt),iterations:data.iterations},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(data.iv),additionalData:new TextEncoder().encode('itabashi-private-view-v1'),tagLength:128},key,decode(data.ciphertext));
  $('content').srcdoc=new TextDecoder('utf-8',{fatal:true}).decode(clear);$('password').value='';$('gate').hidden=true;$('view').hidden=false;
 }catch(error){$('error').textContent=error.message==='https'?'HTTPSで開いてください。':'開けませんでした。パスワードを確認してください。';}
 finally{$('open').disabled=false;$('open').textContent='開く';}
});
$('lock').addEventListener('click',()=>{$('content').removeAttribute('srcdoc');$('view').hidden=true;$('gate').hidden=false;$('password').value='';$('password').focus();});
</script></body></html>
